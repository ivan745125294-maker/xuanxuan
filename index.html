<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>璇璇生日附加页</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg1: #f8f4ff;
      --bg2: #fcfbff;
      --bg3: #f3ecff;
      --text: #4b4358;
      --paper: #fffdf9;
      --shadow: 0 24px 70px rgba(118, 92, 167, 0.12);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 46%, var(--bg3) 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f7f2ff 0%, #fcfbff 45%, #f4edff 100%);
      transition: opacity .6s ease, visibility .6s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(88vw, 460px);
      border-radius: 28px;
      padding: 28px 24px;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(223, 211, 247, .9);
      box-shadow: 0 20px 60px rgba(118, 92, 167, 0.10);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .loading-title {
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ae99cf;
      margin-bottom: 14px;
    }

    .loading-text {
      font-size: 24px;
      line-height: 1.5;
      color: #4d425a;
      margin-bottom: 18px;
    }

    .loading-sub {
      font-size: 14px;
      line-height: 1.8;
      color: #7e738d;
      margin-bottom: 18px;
    }

    .progress {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #f1eaff;
      overflow: hidden;
      border: 1px solid #e7dbff;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #d8c7ff, #efdae8, #d8c7ff);
      animation: loadingBar 1.15s ease forwards;
    }

    @keyframes loadingBar {
      from { width: 0%; }
      to { width: 100%; }
    }

    .shell {
      width: 100%;
      max-width: 920px;
      min-height: 700px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(216,201,242,0.75);
      border-radius: 34px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(10px) scale(.992);
      transition: opacity .7s ease, transform .7s ease;
    }

    .shell.ready {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .top-line {
      height: 4px;
      background: linear-gradient(90deg, #d8c6ff, #efd4e7, #d8c6ff);
    }

    .glow {
      position: absolute;
      border-radius: 999px;
      filter: blur(56px);
      opacity: 0.42;
      pointer-events: none;
      transition: transform .25s ease;
    }

    .glow.one {
      width: 220px;
      height: 220px;
      background: #ddd0ff;
      top: -80px;
      right: -70px;
    }

    .glow.two {
      width: 220px;
      height: 220px;
      background: #ffd9ea;
      bottom: -90px;
      left: -70px;
    }

    .inner {
      position: relative;
      z-index: 1;
      padding: 22px 18px 18px;
      min-height: 696px;
      display: flex;
      flex-direction: column;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #f4eeff;
      border: 1px solid #e6dbff;
      color: #7a64a7;
      font-size: 13px;
    }

    .meta-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .site-name {
      font-size: 14px;
      color: #a095b2;
    }

    .music-btn {
      border: 1px solid #e6dbff;
      background: #f8f4ff;
      color: #755f9d;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s ease;
    }

    .music-btn:hover {
      background: #f0e7ff;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 8px;
    }

    .page {
      display: none;
      width: 100%;
      animation: fadeUp .45s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .frame {
      width: 100%;
      max-width: 760px;
      height: 500px;
      margin: 0 auto;
      position: relative;
      border-radius: 30px;
      padding: 30px 28px 88px;
      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(250,246,255,.96));
      border: 1px solid rgba(232,222,248,.95);
      box-shadow: 0 16px 40px rgba(104,82,145,.08);
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 22px;
      border: 1px solid rgba(224,210,247,.7);
      pointer-events: none;
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.9), transparent 35%),
        linear-gradient(120deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
      opacity: .65;
      pointer-events: none;
    }

    .frame-inner {
      position: relative;
      z-index: 1;
      height: 100%;
    }

    .mini {
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #b19fcf;
      margin-bottom: 18px;
    }

    h1, h2 {
      margin: 0;
      font-size: 36px;
      line-height: 1.25;
      color: #43384f;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: pre-line;
    }

    .subtext {
      margin-top: 18px;
      font-size: 16px;
      line-height: 2;
      color: #6a6177;
      white-space: pre-line;
    }

    .welcome-card,
    .egg-page {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      align-items: center;
    }

    .welcome-card h1 {
      font-size: 40px;
    }

    .ribbon {
      width: 96px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #d8c7ff, #efdae8);
      margin: 28px auto 0;
      opacity: .85;
      box-shadow: 0 6px 16px rgba(168,141,219,.2);
    }

    .layer-note {
      margin-top: 24px;
      padding: 18px 18px;
      border-radius: 18px;
      background: #faf6ff;
      border: 1px dashed #dfcffd;
      color: #6e647d;
      font-size: 15px;
      line-height: 1.95;
      white-space: pre-line;
    }

    .letter-paper {
      background: var(--paper);
      border-radius: 22px;
      padding: 24px 22px 24px;
      border: 1px solid #efe7da;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.6),
        0 12px 28px rgba(120,100,150,.06);
      position: relative;
      height: 100%;
      overflow: hidden;
    }

    .letter-paper::before {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      top: 78px;
      bottom: 22px;
      background-image: linear-gradient(to bottom, rgba(210,198,225,.18) 1px, transparent 1px);
      background-size: 100% 38px;
      pointer-events: none;
    }

    .letter-head {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .letter-title {
      font-size: 28px;
      color: #43384f;
      font-weight: 600;
    }

    .letter-mark {
      font-size: 12px;
      color: #b6a7cf;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .letter-scroll {
      position: relative;
      z-index: 1;
      height: calc(100% - 52px);
      overflow-y: auto;
      padding-right: 8px;
      padding-bottom: 96px;
    }

    .letter-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .letter-scroll::-webkit-scrollbar-thumb {
      background: #d9caf3;
      border-radius: 999px;
    }

    .letter-body {
      font-size: 16px;
      line-height: 2.25;
      color: #5e566b;
      white-space: pre-line;
      padding-bottom: 22px;
    }

    .egg-page p {
      margin-top: 16px;
      font-size: 15px;
      line-height: 1.9;
      color: #736882;
      max-width: 520px;
      white-space: pre-line;
    }

    .frame-action {
      position: absolute;
      right: 28px;
      bottom: 28px;
      z-index: 5;
    }

    .frame-btn {
      padding: 12px 18px;
      border: none;
      cursor: pointer;
      border-radius: 18px;
      background: #3f354c;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(63,53,76,.18);
      transition: transform .15s ease, opacity .15s ease;
    }

    .frame-btn:hover {
      transform: translateY(-1px);
      opacity: .96;
    }

    .frame-tag {
      padding: 10px 16px;
      border-radius: 999px;
      background: #f4eeff;
      border: 1px solid #e6dbff;
      color: #7a64a7;
      font-size: 13px;
    }

    .egg-btn {
      border: 1px solid #e5d8ff;
      background: linear-gradient(180deg, #fbf8ff, #f2eaff);
      color: #755f9d;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: all .2s ease;
      box-shadow: 0 8px 18px rgba(135, 108, 183, 0.10);
      margin-top: 18px;
    }

    .egg-btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(180deg, #f8f2ff, #eee3ff);
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ghost-btn {
      padding: 11px 15px;
      border-radius: 16px;
      background: #f4eeff;
      border: 1px solid #e7dbff;
      color: #715c98;
      font-size: 14px;
      cursor: pointer;
    }

    .ghost-btn:hover {
      background: #eee6ff;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #dacbf5;
      cursor: pointer;
      transition: all .2s ease;
    }

    .dot.active {
      width: 34px;
      background: #a888ea;
    }

    .chibi-inline {
      margin-top: 18px;
      width: min(100%, 470px);
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity .35s ease, max-height .55s ease;
    }

    .chibi-inline.show {
      opacity: 1;
      max-height: 700px;
    }

    .chibi-inline img {
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      display: block;
      border-radius: 20px;
      box-shadow: none;
      transform: translateY(20px) scale(.96);
      opacity: 0;
    }

    .chibi-inline.show img {
      animation: riseInline .6s cubic-bezier(.22,.9,.24,1) forwards;
    }

    @keyframes riseInline {
      0% {
        transform: translateY(20px) scale(.96);
        opacity: 0;
      }
      70% {
        transform: translateY(-4px) scale(1.01);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 760px) {
      .shell { min-height: auto; }
      .inner { min-height: auto; padding: 18px 14px 16px; }
      .frame {
        height: 520px;
        padding: 24px 18px 84px;
      }
      h1, h2 { font-size: 28px; }
      .subtext, .letter-body, .layer-note { font-size: 15px; }
      .welcome-card h1 { font-size: 30px; }
      .letter-paper {
        padding: 20px 16px 20px;
      }
      .letter-paper::before {
        left: 16px;
        right: 16px;
      }
      .letter-title {
        font-size: 24px;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-group {
        justify-content: center;
      }
      .frame-action {
        right: 18px;
        bottom: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-card">
      <div class="loading-title" id="loadingTitle"></div>
      <div class="loading-text" id="loadingText"></div>
      <div class="loading-sub" id="loadingSub"></div>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <div class="shell" id="shell">
    <div class="top-line"></div>
    <div class="glow one" id="glowOne"></div>
    <div class="glow two" id="glowTwo"></div>

    <div class="inner">
      <div class="meta">
        <div class="badge" id="pageLabel"></div>
        <div class="meta-right">
          <div class="site-name" id="siteName"></div>
          <button class="music-btn" id="musicToggle" type="button">♪ 音乐开</button>
        </div>
      </div>

      <div class="stage">
        <section class="page active" id="page0">
          <div class="frame">
            <div class="frame-inner welcome-card">
              <div class="mini" id="p1Mini"></div>
              <h1 id="p1Title"></h1>
              <div class="subtext" id="p1Text"></div>
              <div class="ribbon"></div>
            </div>
            <div class="frame-action">
              <button class="frame-btn" id="p1Btn" onclick="goToPage(1)"></button>
            </div>
          </div>
        </section>

        <section class="page" id="page1">
          <div class="frame">
            <div class="frame-inner">
              <div class="mini" id="p2Mini"></div>
              <h2 id="p2Title"></h2>
              <div class="subtext" id="p2Text"></div>
              <div class="layer-note" id="p2Note"></div>
            </div>
            <div class="frame-action">
              <button class="frame-btn" id="p2Btn" onclick="goToPage(2)"></button>
            </div>
          </div>
        </section>

        <section class="page" id="page2">
          <div class="frame">
            <div class="frame-inner">
              <div class="mini" id="p3Mini"></div>
              <div class="letter-paper">
                <div class="letter-head">
                  <div class="letter-title" id="p3Title"></div>
                  <div class="letter-mark" id="p3Mark"></div>
                </div>
                <div class="letter-scroll">
                  <div class="letter-body" id="p3Body"></div>
                </div>
              </div>
            </div>
            <div class="frame-action">
              <button class="frame-btn" id="p3Btn" onclick="goToPage(3)"></button>
            </div>
          </div>
        </section>

        <section class="page" id="page3">
          <div class="frame">
            <div class="frame-inner egg-page" id="eggPage">
              <div class="egg-copy" id="eggCopy">
                <div class="mini" id="p4Mini"></div>
                <h2 id="p4Title"></h2>
                <p id="p4Text"></p>
                <button class="egg-btn" id="p4EggBtn" onclick="openChibiScene()"></button>
              </div>

              <div class="chibi-inline" id="chibiInline">
                <img src="./chibi-cake.png?v=3" alt="生日彩蛋插画" id="chibiSceneImg" />
              </div>
            </div>
            <div class="frame-action">
              <div class="frame-tag" id="p4Tag"></div>
            </div>
          </div>
        </section>
      </div>

      <div class="controls">
        <div class="btn-group">
          <button class="ghost-btn" id="prevBtn" onclick="prevPage()"></button>
        </div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </div>

  <audio id="bgm" src="./bgm.m4a" loop preload="auto"></audio>
  <audio id="voice" src="./voice.m4a" preload="auto"></audio>

  <script>
    const CONTENT = {
      siteName: "璇璇生日附加页",
      labels: ["01 / 祝福", "02 / 夹层", "03 / 信", "04 / 彩蛋"],

      loading: {
        title: "birthday extra page",
        text: "正在打开璇璇的生日附加页…",
        sub: "这一次不是普通链接，是礼物里的隐藏夹层。"
      },

      page1: {
        mini: "birthday card",
        title: "给璇璇的一页生日祝福",
        text: "生日快乐。\n愿你新的一岁平安、明亮、顺遂，常常开心，偶尔惊喜，也一直拥有感受幸福的能力。",
        btn: "继续往下看"
      },

      page2: {
        mini: "hidden layer",
        title: "这一页算礼物里的隐藏小夹层",
        text: "第一段:2021年冬季的一段DC小对话开始，我认识了一个女孩，她有点不同，喜欢玩上单，偶尔也会骂人，但是对我却从来是最温柔的那一个。",
        note: "第二段:后来我慢慢发现，有些人在心里的位置，并不是靠聊天多少来决定的。哪怕不是每天都说很多话，哪怕中间隔着时间和距离，可只要想起她的时候，心里还是会很自然地软一下。你对我来说，一直都是这样的人。",
        btn: "继续往下看"
      },

      page3: {
        mini: "letter",
        title: "写给璇璇的话",
        mark: "letter",
        body: `璇璇：

其实一开始，我没想把这份礼物准备得这么复杂。
本来只是觉得，既然是你的生日，想认真送你一点东西。
可后来越准备越觉得，如果只是很普通地买一份礼物，好像还是差了一点。

因为对我来说，你一直都不是一个可以被“随便对待”的人。

我们认识已经很久了。
虽然我们不是那种每天都会聊很多很多的人，
可你始终都在。
不是很热闹地存在着，
却也从来没有真正从我的生活里淡下去。

有时候我会觉得，人与人之间很奇妙。
有些人不需要天天出现，
也不会因为时间久了，就变得模糊。
反而是在某些很安静的时候，
会突然想起，
原来这个人一直都还在心里一个很柔软的位置上。

你对我来说，一直都是这样。

所以这次准备礼物的时候，
我才会忍不住想，
能不能再多放一点心思，
能不能让它不只是“生日礼物”这么简单。

我想让你打开的时候，
看到的不只是盒子里的东西，
而是会知道，
这些都是我一点一点想过、挑过、放进去的。
从礼物本身，到盒子，到里面那些零零碎碎的小细节，
再到你现在看到的这一页，
其实都算是我藏进去的一部分心意。

我不知道这些会不会让你觉得惊喜，
也不知道你会不会在意到这么多细小的地方。
但对我来说，
在准备它们的时候，
我心里一直有一个很简单的念头——
就是希望你会开心。

希望你收到的时候会笑一下，
希望你会觉得，
原来真的有人把这件事放在心上，
也真的有人愿意为了你，多花一点时间，多花一点心思。

很多话我平时其实不太会说，
可有些感觉是真的。
是真的会在挑东西的时候想到你，
也是真的会在很多很普通的时候，
突然想起你。

所以如果这份礼物，
还有这些藏在里面的小心思，
最后能让你有一点点感动，
或者只是让你在某个瞬间觉得心里暖了一下，
那我就会觉得，这一切都很值得。

生日快乐，璇璇。
也希望你以后一直都能遇到温柔的事，
遇到真心对待你的人，
然后一直一直，过得比想象中更幸福一点。

—— 徐源`,
        btn: "还有最后一页"
      },

      page4: {
        mini: "final page",
        title: "还有最后一个小彩蛋",
        text: "如果你已经看到这里了，\n那这份礼物里藏着的小心思，应该也算被你好好收到了。",
        eggBtn: "for 最好的璇璇",
        tag: "最后一页"
      },

      common: {
        prevBtn: "上一层"
      }
    };

    const labels = CONTENT.labels;
    let currentStep = 0;
    let musicEnabled = true;
    let bgmStarted = false;
    let voicePlayed = false;
    let chibiOpened = false;

    const pages = [
      document.getElementById("page0"),
      document.getElementById("page1"),
      document.getElementById("page2"),
      document.getElementById("page3")
    ];

    const bgm = document.getElementById("bgm");
    const voice = document.getElementById("voice");
    const musicToggle = document.getElementById("musicToggle");
    const chibiInline = document.getElementById("chibiInline");
    const eggPage = document.getElementById("eggPage");

    bgm.volume = 0.26;
    voice.volume = 1.0;
    bgm.muted = false;

    function applyContent() {
      document.getElementById("siteName").textContent = CONTENT.siteName;

      document.getElementById("loadingTitle").textContent = CONTENT.loading.title;
      document.getElementById("loadingText").textContent = CONTENT.loading.text;
      document.getElementById("loadingSub").textContent = CONTENT.loading.sub;

      document.getElementById("p1Mini").textContent = CONTENT.page1.mini;
      document.getElementById("p1Title").textContent = CONTENT.page1.title;
      document.getElementById("p1Text").textContent = CONTENT.page1.text;
      document.getElementById("p1Btn").textContent = CONTENT.page1.btn;

      document.getElementById("p2Mini").textContent = CONTENT.page2.mini;
      document.getElementById("p2Title").textContent = CONTENT.page2.title;
      document.getElementById("p2Text").textContent = CONTENT.page2.text;
      document.getElementById("p2Note").textContent = CONTENT.page2.note;
      document.getElementById("p2Btn").textContent = CONTENT.page2.btn;

      document.getElementById("p3Mini").textContent = CONTENT.page3.mini;
      document.getElementById("p3Title").textContent = CONTENT.page3.title;
      document.getElementById("p3Mark").textContent = CONTENT.page3.mark;
      document.getElementById("p3Body").textContent = CONTENT.page3.body;
      document.getElementById("p3Btn").textContent = CONTENT.page3.btn;

      document.getElementById("p4Mini").textContent = CONTENT.page4.mini;
      document.getElementById("p4Title").textContent = CONTENT.page4.title;
      document.getElementById("p4Text").textContent = CONTENT.page4.text;
      document.getElementById("p4EggBtn").textContent = CONTENT.page4.eggBtn;
      document.getElementById("p4Tag").textContent = CONTENT.page4.tag;

      document.getElementById("prevBtn").textContent = CONTENT.common.prevBtn;
    }

    async function tryPlayBgm() {
      if (!musicEnabled) return false;
      try {
        bgm.muted = false;
        await bgm.play();
        bgmStarted = true;
        updateMusicButton();
        return true;
      } catch (e) {
        updateMusicButton();
        return false;
      }
    }

    function updateMusicButton() {
      if (!musicEnabled) {
        musicToggle.textContent = "♪ 音乐关";
      } else if (bgm.paused) {
        musicToggle.textContent = "♪ 点我开音乐";
      } else {
        musicToggle.textContent = "♪ 音乐开";
      }
    }

    async function ensureBgmStarted() {
      if (!musicEnabled) return;
      if (!bgmStarted || bgm.paused) {
        await tryPlayBgm();
      }
    }

    musicToggle.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (bgm.paused) {
        musicEnabled = true;
        await tryPlayBgm();
      } else {
        bgm.pause();
        musicEnabled = false;
        updateMusicButton();
      }
    });

    async function goToPage(index) {
      await ensureBgmStarted();
      currentStep = index;
      renderPage();
    }

    async function prevPage() {
      await ensureBgmStarted();
      if (currentStep > 0) {
        currentStep--;
        renderPage();
      }
    }

    function renderPage() {
      pages.forEach((page, index) => {
        page.classList.toggle("active", index === currentStep);
      });
      document.getElementById("pageLabel").textContent = labels[currentStep];
      renderDots();
    }

    function renderDots() {
      const dotsWrap = document.getElementById("dots");
      dotsWrap.innerHTML = "";
      for (let i = 0; i < pages.length; i++) {
        const dot = document.createElement("div");
        dot.className = i === currentStep ? "dot active" : "dot";
        dot.onclick = async () => {
          await ensureBgmStarted();
          currentStep = i;
          renderPage();
        };
        dotsWrap.appendChild(dot);
      }
    }

    async function openChibiScene() {
      await ensureBgmStarted();

      if (!chibiOpened) {
        chibiOpened = true;
        eggPage.classList.add("reveal");
        chibiInline.classList.add("show");

        if (!voicePlayed) {
          voicePlayed = true;
          try {
            if (!bgm.paused) bgm.volume = 0.08;
            voice.currentTime = 0;
            await voice.play();
          } catch (e) {}
        }
      }
    }

    voice.addEventListener("ended", () => {
      if (!bgm.paused && musicEnabled) {
        bgm.volume = 0.26;
      }
    });

    window.addEventListener("load", () => {
      applyContent();

      const loading = document.getElementById("loadingScreen");
      const shell = document.getElementById("shell");

      setTimeout(async () => {
        loading.classList.add("hidden");
        shell.classList.add("ready");
        await tryPlayBgm();
        updateMusicButton();
      }, 1050);
    });

    document.addEventListener("pointerdown", async () => {
      if (!bgmStarted && musicEnabled) {
        await tryPlayBgm();
      }
    }, { once: true });

    const glowOne = document.getElementById("glowOne");
    const glowTwo = document.getElementById("glowTwo");

    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 12;
      const y = (e.clientY / window.innerHeight - 0.5) * 12;
      glowOne.style.transform = `translate(${x}px, ${y}px)`;
      glowTwo.style.transform = `translate(${-x}px, ${-y}px)`;
    });

    applyContent();
    renderPage();
    updateMusicButton();
  </script>
</body>
</html>
