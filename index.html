<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>璇璇生日附加页</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg1: #f8f4ff;
      --bg2: #fcfbff;
      --bg3: #f3ecff;
      --text: #4b4358;
      --paper: #fffdf9;
      --shadow: 0 24px 70px rgba(118, 92, 167, 0.12);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 46%, var(--bg3) 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f7f2ff 0%, #fcfbff 45%, #f4edff 100%);
      transition: opacity .6s ease, visibility .6s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(88vw, 460px);
      border-radius: 28px;
      padding: 28px 24px;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(223, 211, 247, .9);
      box-shadow: 0 20px 60px rgba(118, 92, 167, 0.10);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .loading-title {
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ae99cf;
      margin-bottom: 14px;
    }

    .loading-text {
      font-size: 24px;
      line-height: 1.5;
      color: #4d425a;
      margin-bottom: 18px;
    }

    .loading-sub {
      font-size: 14px;
      line-height: 1.8;
      color: #7e738d;
      margin-bottom: 18px;
    }

    .progress {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #f1eaff;
      overflow: hidden;
      border: 1px solid #e7dbff;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #d8c7ff, #efdae8, #d8c7ff);
      animation: loadingBar 1.15s ease forwards;
    }

    @keyframes loadingBar {
      from { width: 0%; }
      to { width: 100%; }
    }

    .shell {
      width: 100%;
      max-width: 920px;
      min-height: 700px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(216,201,242,0.75);
      border-radius: 34px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(10px) scale(.992);
      transition: opacity .7s ease, transform .7s ease;
    }

    .shell.ready {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .top-line {
      height: 4px;
      background: linear-gradient(90deg, #d8c6ff, #efd4e7, #d8c6ff);
    }

    .glow {
      position: absolute;
      border-radius: 999px;
      filter: blur(56px);
      opacity: 0.42;
      pointer-events: none;
      transition: transform .25s ease;
    }

    .glow.one {
      width: 220px;
      height: 220px;
      background: #ddd0ff;
      top: -80px;
      right: -70px;
    }

    .glow.two {
      width: 220px;
      height: 220px;
      background: #ffd9ea;
      bottom: -90px;
      left: -70px;
    }

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,.7);
      box-shadow: 0 0 18px rgba(226, 208, 255, .7);
      animation: floatParticle linear infinite;
      opacity: .55;
    }

    .particle.p1 { width: 5px; height: 5px; left: 10%; top: 90%; animation-duration: 12s; animation-delay: 0s; }
    .particle.p2 { width: 4px; height: 4px; left: 22%; top: 96%; animation-duration: 15s; animation-delay: 1s; }
    .particle.p3 { width: 6px; height: 6px; left: 36%; top: 92%; animation-duration: 13s; animation-delay: 2s; }
    .particle.p4 { width: 4px; height: 4px; left: 54%; top: 94%; animation-duration: 16s; animation-delay: 1.5s; }
    .particle.p5 { width: 5px; height: 5px; left: 68%; top: 98%; animation-duration: 14s; animation-delay: .5s; }
    .particle.p6 { width: 4px; height: 4px; left: 82%; top: 95%; animation-duration: 17s; animation-delay: 2.2s; }

    @keyframes floatParticle {
      0% {
        transform: translateY(0) translateX(0) scale(.95);
        opacity: 0;
      }
      12% {
        opacity: .45;
      }
      70% {
        opacity: .55;
      }
      100% {
        transform: translateY(-760px) translateX(22px) scale(1.15);
        opacity: 0;
      }
    }

    .inner {
      position: relative;
      z-index: 1;
      padding: 22px 18px 18px;
      min-height: 696px;
      display: flex;
      flex-direction: column;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #f4eeff;
      border: 1px solid #e6dbff;
      color: #7a64a7;
      font-size: 13px;
    }

    .meta-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .site-name {
      font-size: 14px;
      color: #a095b2;
    }

    .page-count {
      font-size: 13px;
      color: #9b8eb0;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(248,244,255,.86);
      border: 1px solid #ebe1ff;
    }

    .music-btn {
      border: 1px solid #e6dbff;
      background: #f8f4ff;
      color: #755f9d;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s ease;
    }

    .music-btn:hover {
      background: #f0e7ff;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 8px;
      position: relative;
    }

    .page {
      display: none;
      width: 100%;
      animation: fadeUp .45s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .frame {
      width: 100%;
      max-width: 760px;
      height: 500px;
      margin: 0 auto;
      position: relative;
      border-radius: 30px;
      padding: 30px 28px 88px;
      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(250,246,255,.96));
      border: 1px solid rgba(232,222,248,.95);
      box-shadow: 0 16px 40px rgba(104,82,145,.08);
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 22px;
      border: 1px solid rgba(224,210,247,.7);
      pointer-events: none;
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.9), transparent 35%),
        linear-gradient(120deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
      opacity: .65;
      pointer-events: none;
    }

    .frame-inner {
      position: relative;
      z-index: 1;
      height: 100%;
    }

    .mini {
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #b19fcf;
      margin-bottom: 18px;
    }

    h1, h2 {
      margin: 0;
      font-size: 36px;
      line-height: 1.25;
      color: #43384f;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: pre-line;
    }

    .subtext {
      margin-top: 18px;
      font-size: 16px;
      line-height: 2;
      color: #6a6177;
      white-space: pre-line;
    }

    .welcome-card {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      align-items: center;
      position: relative;
    }

    .welcome-card h1 {
      font-size: 40px;
    }

    .ribbon {
      width: 96px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #d8c7ff, #efdae8);
      margin: 28px auto 0;
      opacity: .85;
      box-shadow: 0 6px 16px rgba(168,141,219,.2);
    }

    .music-hint {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(248,244,255,.85);
      border: 1px solid #e8dcff;
      color: #856fae;
      font-size: 13px;
      line-height: 1.5;
      opacity: .95;
      transition: opacity .3s ease, transform .3s ease;
    }

    .music-hint.hidden {
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
    }

    .corner-whisper {
      position: absolute;
      top: 18px;
      right: 8px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      cursor: pointer;
    }

    .whisper-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #e6d8ff, #f5e0eb);
      box-shadow: 0 0 0 6px rgba(241,233,255,.45);
      opacity: .92;
    }

    .whisper-card {
      max-width: 200px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.9);
      border: 1px solid #ece2ff;
      color: #8a7ea1;
      font-size: 12px;
      line-height: 1.7;
      box-shadow: 0 10px 24px rgba(134,112,170,.08);
      opacity: 0;
      transform: translateY(6px);
      transition: all .25s ease;
      pointer-events: none;
    }

    .corner-whisper:hover .whisper-card,
    .corner-whisper.open .whisper-card {
      opacity: 1;
      transform: translateY(0);
    }

    .layer-note {
      margin-top: 24px;
      padding: 18px 18px;
      border-radius: 18px;
      background: #faf6ff;
      border: 1px dashed #dfcffd;
      color: #6e647d;
      font-size: 15px;
      line-height: 1.95;
      white-space: pre-line;
    }

    .letter-paper {
      background: var(--paper);
      border-radius: 22px;
      padding: 24px 22px 24px;
      border: 1px solid #efe7da;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.6),
        0 12px 28px rgba(120,100,150,.06);
      position: relative;
      height: 100%;
      overflow: hidden;
    }

    .letter-paper::before {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      top: 78px;
      bottom: 22px;
      background-image: linear-gradient(to bottom, rgba(210,198,225,.18) 1px, transparent 1px);
      background-size: 100% 38px;
      pointer-events: none;
    }

    .letter-head {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .letter-title {
      font-size: 28px;
      color: #43384f;
      font-weight: 600;
    }

    .letter-mark {
      font-size: 12px;
      color: #b6a7cf;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .letter-scroll {
      position: relative;
      z-index: 1;
      height: calc(100% - 52px);
      overflow-y: auto;
      padding-right: 8px;
      padding-bottom: 96px;
    }

    .letter-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .letter-scroll::-webkit-scrollbar-thumb {
      background: #d9caf3;
      border-radius: 999px;
    }

    .letter-body {
      font-size: 16px;
      line-height: 2.25;
      color: #5e566b;
      white-space: pre-line;
      padding-bottom: 22px;
    }

    .egg-page {
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background .4s ease;
    }

    .egg-page.reveal {
      background: radial-gradient(circle at center, rgba(250,244,255,.55), transparent 65%);
    }

    .egg-copy {
      position: relative;
      z-index: 2;
      transition: opacity .35s ease, transform .35s ease;
    }

    .egg-page.reveal .egg-copy {
      opacity: 0;
      transform: translateY(-12px) scale(.98);
      pointer-events: none;
    }

    .egg-page p {
      margin-top: 16px;
      font-size: 15px;
      line-height: 1.9;
      color: #736882;
      max-width: 520px;
      white-space: pre-line;
    }

    .frame-action {
      position: absolute;
      right: 28px;
      bottom: 28px;
      z-index: 5;
    }

    .frame-btn {
      padding: 12px 18px;
      border: none;
      cursor: pointer;
      border-radius: 18px;
      background: #3f354c;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(63,53,76,.18);
      transition: transform .15s ease, opacity .15s ease, box-shadow .2s ease;
      transform-origin: center;
    }

    .frame-btn:hover {
      transform: translateY(-1px);
      opacity: .96;
      box-shadow: 0 12px 22px rgba(63,53,76,.22);
    }

    .frame-btn.tap,
    .ghost-btn.tap,
    .egg-btn.tap,
    .music-btn.tap,
    .replay-btn.tap {
      animation: buttonTap .28s ease;
    }

    @keyframes buttonTap {
      0% { transform: scale(1); }
      40% { transform: scale(.965); }
      100% { transform: scale(1); }
    }

    .frame-tag {
      padding: 10px 16px;
      border-radius: 999px;
      background: #f4eeff;
      border: 1px solid #e6dbff;
      color: #7a64a7;
      font-size: 13px;
    }

    .egg-btn {
      border: 1px solid #e5d8ff;
      background: linear-gradient(180deg, #fbf8ff, #f2eaff);
      color: #755f9d;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: all .2s ease;
      box-shadow: 0 8px 18px rgba(135, 108, 183, 0.10);
      margin-top: 18px;
    }

    .egg-btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(180deg, #f8f2ff, #eee3ff);
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ghost-btn {
      padding: 11px 15px;
      border-radius: 16px;
      background: #f4eeff;
      border: 1px solid #e7dbff;
      color: #715c98;
      font-size: 14px;
      cursor: pointer;
      transition: transform .15s ease, background .2s ease;
    }

    .ghost-btn:hover {
      background: #eee6ff;
      transform: translateY(-1px);
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #dacbf5;
      cursor: pointer;
      transition: all .2s ease;
    }

    .dot.active {
      width: 34px;
      background: #a888ea;
    }

    .chibi-inline {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 24px 52px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    .egg-page.reveal .chibi-inline {
      opacity: 1;
      pointer-events: auto;
    }

    .chibi-inline img {
      width: min(100%, 470px);
      max-height: 360px;
      object-fit: contain;
      display: block;
      border-radius: 20px;
      box-shadow: none;
      transform: translateY(20px) scale(.96);
      opacity: 0;
    }

    .egg-page.reveal .chibi-inline img {
      animation: riseInline .6s cubic-bezier(.22,.9,.24,1) forwards;
    }

    @keyframes riseInline {
      0% {
        transform: translateY(20px) scale(.96);
        opacity: 0;
      }
      70% {
        transform: translateY(-4px) scale(1.01);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .final-message {
      position: absolute;
      left: 50%;
      bottom: 86px;
      transform: translateX(-50%) translateY(12px);
      z-index: 4;
      width: min(88%, 520px);
      padding: 14px 18px;
      border-radius: 20px;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(233,223,250,.95);
      color: #6e627d;
      font-size: 15px;
      line-height: 1.9;
      box-shadow: 0 14px 30px rgba(120, 100, 150, .08);
      opacity: 0;
      pointer-events: none;
      transition: all .45s ease;
      backdrop-filter: blur(6px);
    }

    .final-message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .replay-wrap {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(10px);
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      transition: all .45s ease;
    }

    .replay-wrap.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .replay-btn {
      padding: 11px 18px;
      border: 1px solid #e5d8ff;
      background: rgba(251,248,255,.96);
      color: #755f9d;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(135, 108, 183, 0.10);
      transition: all .2s ease;
    }

    .replay-btn:hover {
      transform: translateY(-1px);
      background: rgba(247,240,255,.98);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(18px);
      z-index: 1200;
      min-width: min(86vw, 320px);
      max-width: min(88vw, 420px);
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(67,56,79,.92);
      color: #fff;
      font-size: 13px;
      line-height: 1.7;
      box-shadow: 0 16px 36px rgba(67,56,79,.22);
      opacity: 0;
      pointer-events: none;
      transition: all .25s ease;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 760px) {
      .shell { min-height: auto; }
      .inner { min-height: auto; padding: 18px 14px 16px; }
      .frame {
        height: 520px;
        padding: 24px 18px 84px;
      }
      h1, h2 { font-size: 28px; }
      .subtext, .letter-body, .layer-note { font-size: 15px; }
      .welcome-card h1 { font-size: 30px; }
      .letter-paper {
        padding: 20px 16px 20px;
      }
      .letter-paper::before {
        left: 16px;
        right: 16px;
      }
      .letter-title {
        font-size: 24px;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-group {
        justify-content: center;
      }
      .frame-action {
        right: 18px;
        bottom: 18px;
      }
      .final-message {
        bottom: 88px;
        font-size: 14px;
      }
      .page-count {
        order: 3;
      }
      .corner-whisper {
        top: 12px;
        right: 2px;
      }
      .music-hint {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-card">
      <div class="loading-title" id="loadingTitle"></div>
      <div class="loading-text" id="loadingText"></div>
      <div class="loading-sub" id="loadingSub"></div>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <div class="shell" id="shell">
    <div class="top-line"></div>
    <div class="glow one" id="glowOne"></div>
    <div class="glow two" id="glowTwo"></div>

    <div class="particles" aria-hidden="true">
      <span class="particle p1"></span>
      <span class="particle p2"></span>
      <span class="particle p3"></span>
      <span class="particle p4"></span>
      <span class="particle p5"></span>
      <span class="particle p6"></span>
    </div>

    <div class="inner">
      <div class="meta">
        <div class="badge" id="pageLabel"></div>
        <div class="meta-right">
          <div class="site-name" id="siteName"></div>
          <div class="page-count" id="pageCount"></div>
          <button class="music-btn" id="musicToggle" type="button">♪ 音乐开</button>
        </div>
      </div>

      <div class="stage">
        <section class="page active" id="page0">
          <div class="frame">
            <div class="frame-inner welcome-card">
              <div class="corner-whisper" id="cornerWhisper">
                <div class="whisper-dot"></div>
                <div class="whisper-card" id="whisperText"></div>
              </div>

              <div class="mini" id="p1Mini"></div>
              <h1 id="p1Title"></h1>
              <div class="subtext" id="p1Text"></div>
              <div class="music-hint" id="musicHint"></div>
              <div class="ribbon"></div>
            </div>
            <div class="frame-action">
              <button class="frame-btn" id="p1Btn" onclick="goToPage(1, this)"></button>
            </div>
          </div>
        </section>

        <section class="page" id="page1">
          <div class="frame">
            <div class="frame-inner">
              <div class="mini" id="p2Mini"></div>
              <h2 id="p2Title"></h2>
              <div class="subtext" id="p2Text"></div>
              <div class="layer-note" id="p2Note"></div>
            </div>
            <div class="frame-action">
              <button class="frame-btn" id="p2Btn" onclick="goToPage(2, this)"></button>
            </div>
          </div>
        </section>

        <section class="page" id="page2">
          <div class="frame">
            <div class="frame-inner">
              <div class="mini" id="p3Mini"></div>
              <div class="letter-paper">
                <div class="letter-head">
                  <div class="letter-title" id="p3Title"></div>
                  <div class="letter-mark" id="p3Mark"></div>
                </div>
                <div class="letter-scroll">
                  <div class="letter-body" id="p3Body"></div>
                </div>
              </div>
            </div>
            <div class="frame-action">
              <button class="frame-btn" id="p3Btn" onclick="goToPage(3, this)"></button>
            </div>
          </div>
        </section>

        <section class="page" id="page3">
          <div class="frame">
            <div class="frame-inner egg-page" id="eggPage">
              <div class="egg-copy" id="eggCopy">
                <div class="mini" id="p4Mini"></div>
                <h2 id="p4Title"></h2>
                <p id="p4Text"></p>
                <button class="egg-btn" id="p4EggBtn" onclick="openChibiScene(this)"></button>
              </div>

              <div class="chibi-inline" id="chibiInline">
                <img src="./chibi-cake.png?v=4" alt="生日彩蛋插画" id="chibiSceneImg" />
              </div>

              <div class="final-message" id="finalMessage"></div>

              <div class="replay-wrap" id="replayWrap">
                <button class="replay-btn" id="replayBtn" onclick="restartStory(this)"></button>
              </div>
            </div>
            <div class="frame-action">
              <div class="frame-tag" id="p4Tag"></div>
            </div>
          </div>
        </section>
      </div>

      <div class="controls">
        <div class="btn-group">
          <button class="ghost-btn" id="prevBtn" onclick="prevPage(this)"></button>
        </div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <audio id="bgm" src="./bgm.m4a" loop preload="auto"></audio>
  <audio id="voice" src="./voice.m4a" preload="auto"></audio>

  <script>
    const CONTENT = {
      siteName: "璇璇生日附加页",
      labels: ["01 / 祝福", "02 / 夹层", "03 / 信", "04 / 彩蛋"],

      loading: {
        title: "birthday extra page",
        text: "正在打开璇璇的生日附加页…",
        sub: "这是我偷偷塞进礼物里的另一层心意。"
      },

      page1: {
        mini: "birthday card",
        title: "给璇璇的一页生日祝福",
        text: "生日快乐。\n愿你新的一岁平安、明亮、顺遂，常常开心，偶尔惊喜，也一直拥有感受幸福的能力。",
        btn: "继续往下看",
        musicHint: "点一下页面或按钮，音乐会一起开始。",
        whisper: "这一页不是普通网页，是藏在礼物里的小心思。"
      },

      page2: {
        mini: "hidden layer",
        title: "隐藏小夹层",
        text: "从 2021 年冬天的一段 DC 小对话开始，我认识了一个很特别的女孩。她喜欢玩上单，有自己的脾气，也有自己独一无二的样子。但对我来说，印象最深的，一直都不是别的，而是这么久以来，她好像总会把温柔留给我。",
        note: "后来我才发现，原来有些人不用天天出现，也不会因为时间过去就变淡。就算不是一直热热闹闹地联系着，可每次想到她的时候，心里还是会轻轻软一下。你对我来说，一直都是这样。",
        btn: "继续往下看"
      },

      page3: {
        mini: "letter",
        title: "写给璇璇的话",
        mark: "letter",
        body: `璇璇：
其实一开始，我没想把这份礼物准备得这么复杂。

最开始只是觉得，既然是你的生日，我想认真送你一点东西。
可后来越准备越觉得，如果只是很普通地挑一份礼物，好像还是差了一点。

因为你在我这里，一直都不是那种可以被我轻轻带过的人。

我们认识已经很久了。
我记得一切都是从 DC 的那段小对话开始的，
从一起打游戏，
到后来断断续续地联系着，
再到后来的很多很多时候，
你就这样一点一点地，
在我的生活里占下了一个位置。

甚至有时候想想会觉得很奇妙，
原来连一些很小很小的话题，
都会慢慢变得有记忆。
比如现在看到“炸鸡”这两个字，
我都会先想到你。

不是那种特别吵闹、特别张扬的存在，
可也正因为这样，
你反而会让我记很久。

有时候我也会觉得，
明明我们不是那种每天都会聊很多很多的人，
可在一些很普通的时候，
我还是会很自然地想到你。

不是那种特别刻意的想起，
而是一种很安静、很自然的感觉。
就好像你一直都在我心里的某个位置上。

后来我才发现，
原来真正特别的人就是这样。
她不一定时时刻刻都在你眼前，
可她一直都在你心里。

你对我来说，一直都是这样。

所以这次准备礼物的时候，
我才会忍不住想多放一点心思，
想让它不只是“生日礼物”这么简单。

我想让你打开的时候，
感受到的不只是盒子里的东西，
而是知道，
这些都是我一点一点想过、挑过、认真放进去的。

我不知道这些会不会让你觉得惊喜，
也不知道你会不会在意到这么多细小的地方。
但对我来说，
准备它们的时候，
我心里一直有一个很简单的念头——
就是希望你会开心。

而且很奇怪的是，
在准备这些的时候，
我自己也会觉得很开心。

因为一边想着你，
一边慢慢把这些小心思放进去的时候，
我会觉得，
原来认真为一个人准备生日礼物，
本身就是一件会让人觉得很开心的事。

所以我希望你收到的时候会笑一下，
也希望你会觉得，
原来真的有人把这件事放在心上，
也真的有人愿意为了你，多花一点时间，多花一点心思。

很多话我平时其实不太会说，
可有些感觉是真的。

所以如果这份礼物，
还有这些被我藏进去的小心思，
最后能让你有一点点感动，
或者只是让你在某个瞬间觉得心里暖了一下，
那我就会觉得，这一切都很值得。

生日快乐，璇璇。

也希望以后每一次想起这个生日，
你都会记得，
有人曾经很认真地，把你放在心上。

——徐源`,
  btn: "还有最后一页"
},

      page4: {
        mini: "final page",
        title: "还有最后一个小彩蛋",
        text: "如果你已经看到这里了，\n那这份礼物里藏着的小心思，应该也算被你好好收到了。",
        eggBtn: "For 最好的璇璇",
        tag: "Only for 璇璇",
        finalMessage: "生日快乐，璇璇。\n希望你今天真的会开心，也希望这份小心意，能在你的生日里留下一个很温柔的瞬间。",
        replayBtn: "再看一遍"
      },

      common: {
        prevBtn: "上一层"
      }
    };

    const labels = CONTENT.labels;
    let currentStep = 0;
    let musicEnabled = true;
    let bgmStarted = false;
    let voicePlayed = false;
    let chibiOpened = false;
    let toastTimer = null;

    const pages = [
      document.getElementById("page0"),
      document.getElementById("page1"),
      document.getElementById("page2"),
      document.getElementById("page3")
    ];

    const bgm = document.getElementById("bgm");
    const voice = document.getElementById("voice");
    const musicToggle = document.getElementById("musicToggle");
    const eggPage = document.getElementById("eggPage");
    const chibiSceneImg = document.getElementById("chibiSceneImg");
    const pageCount = document.getElementById("pageCount");
    const musicHint = document.getElementById("musicHint");
    const whisperText = document.getElementById("whisperText");
    const finalMessage = document.getElementById("finalMessage");
    const replayWrap = document.getElementById("replayWrap");
    const toast = document.getElementById("toast");
    const cornerWhisper = document.getElementById("cornerWhisper");

    bgm.volume = 0.26;
    voice.volume = 1.0;
    bgm.muted = false;

    function showToast(text, duration = 2400) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, duration);
    }

    function tapEffect(el) {
      if (!el) return;
      el.classList.remove("tap");
      void el.offsetWidth;
      el.classList.add("tap");
    }

    function applyContent() {
      document.getElementById("siteName").textContent = CONTENT.siteName;

      document.getElementById("loadingTitle").textContent = CONTENT.loading.title;
      document.getElementById("loadingText").textContent = CONTENT.loading.text;
      document.getElementById("loadingSub").textContent = CONTENT.loading.sub;

      document.getElementById("p1Mini").textContent = CONTENT.page1.mini;
      document.getElementById("p1Title").textContent = CONTENT.page1.title;
      document.getElementById("p1Text").textContent = CONTENT.page1.text;
      document.getElementById("p1Btn").textContent = CONTENT.page1.btn;
      musicHint.textContent = CONTENT.page1.musicHint;
      whisperText.textContent = CONTENT.page1.whisper;

      document.getElementById("p2Mini").textContent = CONTENT.page2.mini;
      document.getElementById("p2Title").textContent = CONTENT.page2.title;
      document.getElementById("p2Text").textContent = CONTENT.page2.text;
      document.getElementById("p2Note").textContent = CONTENT.page2.note;
      document.getElementById("p2Btn").textContent = CONTENT.page2.btn;

      document.getElementById("p3Mini").textContent = CONTENT.page3.mini;
      document.getElementById("p3Title").textContent = CONTENT.page3.title;
      document.getElementById("p3Mark").textContent = CONTENT.page3.mark;
      document.getElementById("p3Body").textContent = CONTENT.page3.body;
      document.getElementById("p3Btn").textContent = CONTENT.page3.btn;

      document.getElementById("p4Mini").textContent = CONTENT.page4.mini;
      document.getElementById("p4Title").textContent = CONTENT.page4.title;
      document.getElementById("p4Text").textContent = CONTENT.page4.text;
      document.getElementById("p4EggBtn").textContent = CONTENT.page4.eggBtn;
      document.getElementById("p4Tag").textContent = CONTENT.page4.tag;
      finalMessage.textContent = CONTENT.page4.finalMessage;
      document.getElementById("replayBtn").textContent = CONTENT.page4.replayBtn;

      document.getElementById("prevBtn").textContent = CONTENT.common.prevBtn;
    }

    async function tryPlayBgm() {
      if (!musicEnabled) return false;

      try {
        bgm.muted = false;
        bgm.volume = 0.26;
        await bgm.play();
        bgmStarted = true;
        musicHint.classList.add("hidden");
        updateMusicButton();
        return true;
      } catch (e) {
        updateMusicButton();
        return false;
      }
    }

    function updateMusicButton() {
      if (!musicEnabled) {
        musicToggle.textContent = "♪ 音乐关";
      } else if (bgm.paused) {
        musicToggle.textContent = "♪ 点我开音乐";
      } else {
        musicToggle.textContent = "♪ 音乐开";
      }
    }

    async function ensureBgmStarted() {
      if (!musicEnabled) return;
      if (!bgmStarted || bgm.paused) {
        const ok = await tryPlayBgm();
        if (!ok) {
          showToast("浏览器会拦截自动播放，点一下页面就能开音乐。");
        }
      }
    }

    musicToggle.addEventListener("click", async (e) => {
      e.stopPropagation();
      tapEffect(musicToggle);

      if (bgm.paused) {
        musicEnabled = true;
        const ok = await tryPlayBgm();
        if (!ok) showToast("点一下页面任意位置，也可以开始播放音乐。");
      } else {
        bgm.pause();
        musicEnabled = false;
        updateMusicButton();
      }
    });

    async function goToPage(index, btn = null) {
      tapEffect(btn);
      await ensureBgmStarted();
      currentStep = index;
      renderPage();
    }

    async function prevPage(btn = null) {
      tapEffect(btn);
      await ensureBgmStarted();
      if (currentStep > 0) {
        currentStep--;
        renderPage();
      }
    }

    function renderPage() {
      pages.forEach((page, index) => {
        page.classList.toggle("active", index === currentStep);
      });
      document.getElementById("pageLabel").textContent = labels[currentStep];
      pageCount.textContent = `第 ${currentStep + 1} 页 / 共 ${pages.length} 页`;
      renderDots();
    }

    function renderDots() {
      const dotsWrap = document.getElementById("dots");
      dotsWrap.innerHTML = "";
      for (let i = 0; i < pages.length; i++) {
        const dot = document.createElement("div");
        dot.className = i === currentStep ? "dot active" : "dot";
        dot.onclick = async () => {
          await ensureBgmStarted();
          currentStep = i;
          renderPage();
        };
        dotsWrap.appendChild(dot);
      }
    }

    async function openChibiScene(btn = null) {
      tapEffect(btn);
      await ensureBgmStarted();

      if (!chibiOpened) {
        chibiOpened = true;
        eggPage.classList.add("reveal");

        if (!voicePlayed) {
          voicePlayed = true;
          try {
            if (!bgm.paused) bgm.volume = 0.08;
            voice.currentTime = 0;
            await voice.play();
          } catch (e) {}
        }

        setTimeout(() => {
          finalMessage.classList.add("show");
        }, 900);

        setTimeout(() => {
          replayWrap.classList.add("show");
        }, 1450);
      }
    }

    function restartStory(btn = null) {
      tapEffect(btn);

      currentStep = 0;
      chibiOpened = false;
      voicePlayed = false;

      eggPage.classList.remove("reveal");
      finalMessage.classList.remove("show");
      replayWrap.classList.remove("show");

      voice.pause();
      voice.currentTime = 0;

      if (musicEnabled && !bgm.paused) {
        bgm.volume = 0.26;
        musicHint.classList.add("hidden");
      } else {
        musicHint.classList.remove("hidden");
      }

      renderPage();
      showToast("重新回到开头啦。");
    }

    voice.addEventListener("ended", () => {
      if (!bgm.paused && musicEnabled) {
        bgm.volume = 0.26;
      }
    });

    chibiSceneImg.addEventListener("error", () => {
      showToast("彩蛋图片没有加载出来，请检查 chibi-cake.png 是否和 html 在同一目录。", 3200);
    });

    bgm.addEventListener("error", () => {
      showToast("背景音乐文件没有加载成功，请检查 bgm.m4a 路径。", 3200);
      musicToggle.textContent = "♪ 音乐文件失败";
    });

    voice.addEventListener("error", () => {
      showToast("语音文件没有加载成功，请检查 voice.m4a 路径。", 3200);
    });

    cornerWhisper.addEventListener("click", (e) => {
      e.stopPropagation();
      cornerWhisper.classList.toggle("open");
    });

    document.addEventListener("click", () => {
      cornerWhisper.classList.remove("open");
    });

    window.addEventListener("load", () => {
      const loading = document.getElementById("loadingScreen");
      const shell = document.getElementById("shell");

      setTimeout(async () => {
        loading.classList.add("hidden");
        shell.classList.add("ready");
        await tryPlayBgm();
        updateMusicButton();

        if (bgm.paused) {
          showToast("建议打开声音，再点一下页面开始播放。", 2600);
        }
      }, 1050);
    });

    document.addEventListener("pointerdown", async () => {
      if (!bgmStarted && musicEnabled) {
        await tryPlayBgm();
      }
    }, { once: true });

    const glowOne = document.getElementById("glowOne");
    const glowTwo = document.getElementById("glowTwo");

    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 12;
      const y = (e.clientY / window.innerHeight - 0.5) * 12;
      glowOne.style.transform = `translate(${x}px, ${y}px)`;
      glowTwo.style.transform = `translate(${-x}px, ${-y}px)`;
    });

    applyContent();
    renderPage();
    updateMusicButton();
  </script>
</body>
</html>
