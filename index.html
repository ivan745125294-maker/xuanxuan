<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>璇璇生日附加页</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg1: #f8f4ff;
      --bg2: #fcfbff;
      --bg3: #f3ecff;
      --text: #4b4358;
      --text-soft: #746b82;
      --paper: #fffdf9;
      --shadow: 0 24px 70px rgba(118, 92, 167, 0.12);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 46%, var(--bg3) 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f7f2ff 0%, #fcfbff 45%, #f4edff 100%);
      transition: opacity .6s ease, visibility .6s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(88vw, 460px);
      border-radius: 28px;
      padding: 28px 24px;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(223, 211, 247, .9);
      box-shadow: 0 20px 60px rgba(118, 92, 167, 0.10);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .loading-title {
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ae99cf;
      margin-bottom: 14px;
    }

    .loading-text {
      font-size: 24px;
      line-height: 1.5;
      color: #4d425a;
      margin-bottom: 18px;
    }

    .loading-sub {
      font-size: 14px;
      line-height: 1.8;
      color: #7e738d;
      margin-bottom: 18px;
    }

    .progress {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #f1eaff;
      overflow: hidden;
      border: 1px solid #e7dbff;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #d8c7ff, #efdae8, #d8c7ff);
      animation: loadingBar 1.15s ease forwards;
    }

    @keyframes loadingBar {
      from { width: 0%; }
      to { width: 100%; }
    }

    .shell {
      width: 100%;
      max-width: 920px;
      min-height: 700px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(216,201,242,0.75);
      border-radius: 34px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(10px) scale(.992);
      transition: opacity .7s ease, transform .7s ease;
    }

    .shell.ready {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .top-line {
      height: 4px;
      background: linear-gradient(90deg, #d8c6ff, #efd4e7, #d8c6ff);
    }

    .glow {
      position: absolute;
      border-radius: 999px;
      filter: blur(56px);
      opacity: 0.42;
      pointer-events: none;
      transition: transform .25s ease;
    }

    .glow.one {
      width: 220px;
      height: 220px;
      background: #ddd0ff;
      top: -80px;
      right: -70px;
    }

    .glow.two {
      width: 220px;
      height: 220px;
      background: #ffd9ea;
      bottom: -90px;
      left: -70px;
    }

    .inner {
      position: relative;
      z-index: 1;
      padding: 22px 18px 18px;
      min-height: 696px;
      display: flex;
      flex-direction: column;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #f4eeff;
      border: 1px solid #e6dbff;
      color: #7a64a7;
      font-size: 13px;
    }

    .meta-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .site-name {
      font-size: 14px;
      color: #a095b2;
    }

    .music-btn {
      border: 1px solid #e6dbff;
      background: #f8f4ff;
      color: #755f9d;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s ease;
    }

    .music-btn:hover {
      background: #f0e7ff;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 8px;
    }

    .page {
      display: none;
      width: 100%;
      animation: fadeUp .45s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .frame {
      width: 100%;
      max-width: 760px;
      min-height: 500px;
      margin: 0 auto;
      position: relative;
      border-radius: 30px;
      padding: 30px 28px 88px;
      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(250,246,255,.96));
      border: 1px solid rgba(232,222,248,.95);
      box-shadow: 0 16px 40px rgba(104,82,145,.08);
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 22px;
      border: 1px solid rgba(224,210,247,.7);
      pointer-events: none;
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.9), transparent 35%),
        linear-gradient(120deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
      opacity: .65;
      pointer-events: none;
    }

    .frame-inner {
      position: relative;
      z-index: 1;
    }

    .mini {
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #b19fcf;
      margin-bottom: 18px;
    }

    h1, h2 {
      margin: 0;
      font-size: 36px;
      line-height: 1.25;
      color: #43384f;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: pre-line;
    }

    .subtext {
      margin-top: 18px;
      font-size: 16px;
      line-height: 2;
      color: #6a6177;
      white-space: pre-line;
    }

    .welcome-card {
      min-height: 360px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .welcome-card h1 {
      font-size: 40px;
    }

    .ribbon {
      width: 96px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #d8c7ff, #efdae8);
      margin: 28px auto 0;
      opacity: .85;
      box-shadow: 0 6px 16px rgba(168,141,219,.2);
    }

    .layer-note {
      margin-top: 22px;
      padding: 16px 18px;
      border-radius: 18px;
      background: #faf6ff;
      border: 1px dashed #dfcffd;
      color: #7a6f88;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .memory-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .memory-card {
      padding: 14px 14px 12px;
      border-radius: 18px;
      background: rgba(255,255,255,.9);
      border: 1px solid #eadffd;
      box-shadow: 0 10px 24px rgba(127, 99, 174, .06);
    }

    .memory-card .label {
      font-size: 12px;
      color: #a18fbd;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .memory-card .content {
      font-size: 14px;
      line-height: 1.8;
      color: #665c75;
      white-space: pre-line;
    }

    .tiny-trigger {
      margin-top: 18px;
      display: inline-block;
      color: #866ab8;
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .tiny-secret {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #eadffd;
      font-size: 14px;
      color: #655c73;
      line-height: 1.8;
      white-space: pre-line;
    }

    .letter-paper {
      background: var(--paper);
      border-radius: 22px;
      padding: 24px 22px 86px;
      border: 1px solid #efe7da;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.6),
        0 12px 28px rgba(120,100,150,.06);
      position: relative;
      min-height: 410px;
    }

    .letter-paper::before {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      top: 78px;
      bottom: 22px;
      background-image: linear-gradient(to bottom, rgba(210,198,225,.18) 1px, transparent 1px);
      background-size: 100% 38px;
      pointer-events: none;
    }

    .letter-head {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .letter-title {
      font-size: 28px;
      color: #43384f;
      font-weight: 600;
    }

    .letter-mark {
      font-size: 12px;
      color: #b6a7cf;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .letter-body {
      position: relative;
      z-index: 1;
      font-size: 16px;
      line-height: 2.25;
      color: #5e566b;
      white-space: pre-line;
    }

    .egg-page {
      min-height: 360px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .egg-page p {
      margin-top: 16px;
      font-size: 15px;
      line-height: 1.9;
      color: #736882;
      max-width: 520px;
      white-space: pre-line;
    }

    .frame-action {
      position: absolute;
      right: 28px;
      bottom: 28px;
      z-index: 2;
    }

    .frame-btn {
      padding: 12px 18px;
      border: none;
      cursor: pointer;
      border-radius: 18px;
      background: #3f354c;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(63,53,76,.18);
      transition: transform .15s ease, opacity .15s ease;
    }

    .frame-btn:hover {
      transform: translateY(-1px);
      opacity: .96;
    }

    .frame-tag {
      padding: 10px 16px;
      border-radius: 999px;
      background: #f4eeff;
      border: 1px solid #e6dbff;
      color: #7a64a7;
      font-size: 13px;
    }

    .egg-btn {
      border: 1px solid #e5d8ff;
      background: linear-gradient(180deg, #fbf8ff, #f2eaff);
      color: #755f9d;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: all .2s ease;
      box-shadow: 0 8px 18px rgba(135, 108, 183, 0.10);
      margin-top: 18px;
    }

    .egg-btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(180deg, #f8f2ff, #eee3ff);
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ghost-btn {
      padding: 11px 15px;
      border-radius: 16px;
      background: #f4eeff;
      border: 1px solid #e7dbff;
      color: #715c98;
      font-size: 14px;
      cursor: pointer;
    }

    .ghost-btn:hover {
      background: #eee6ff;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #dacbf5;
      cursor: pointer;
      transition: all .2s ease;
    }

    .dot.active {
      width: 34px;
      background: #a888ea;
    }

    .bottom-text {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
      color: #9b90ab;
    }

    .chibi-overlay {
      position: fixed;
      inset: 0;
      background: rgba(49, 35, 69, 0.32);
      backdrop-filter: blur(8px);
      z-index: 1200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .chibi-overlay.show {
      display: flex;
    }

    .chibi-stage {
      width: min(92vw, 560px);
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(230, 219, 255, 0.95);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(89, 63, 130, 0.18);
      padding: 20px 20px 18px;
      position: relative;
      transform: translateY(24px) scale(.96);
      opacity: 0;
    }

    .chibi-stage.show {
      animation: chibiPop .55s cubic-bezier(.2,.9,.2,1) forwards;
    }

    @keyframes chibiPop {
      0% {
        transform: translateY(28px) scale(.94);
        opacity: 0;
      }
      65% {
        transform: translateY(-4px) scale(1.02);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .chibi-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 999px;
      background: #f3ebff;
      color: #7b64a7;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .chibi-close:hover {
      background: #eadfff;
    }

    .chibi-caption {
      text-align: center;
      font-size: 14px;
      color: #8b7aa5;
      margin: 4px 34px 14px;
    }

    .chibi-scene-img {
      width: 100%;
      display: block;
      border-radius: 20px;
      transform: translateY(24px);
      opacity: 0;
      min-height: 180px;
      object-fit: cover;
      background: #faf7ff;
    }

    .chibi-scene-img.show {
      animation: sceneRise .7s .08s cubic-bezier(.22,.9,.24,1) forwards;
    }

    @keyframes sceneRise {
      0% {
        transform: translateY(24px);
        opacity: 0;
      }
      70% {
        transform: translateY(-3px);
        opacity: 1;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 760px) {
      .shell { min-height: auto; }
      .inner { min-height: auto; padding: 18px 14px 16px; }
      .frame {
        min-height: 520px;
        padding: 24px 18px 84px;
      }
      h1, h2 { font-size: 28px; }
      .subtext, .letter-body { font-size: 15px; }
      .welcome-card h1 { font-size: 30px; }
      .letter-paper {
        padding: 20px 16px 78px;
      }
      .letter-paper::before {
        left: 16px;
        right: 16px;
      }
      .letter-title {
        font-size: 24px;
      }
      .memory-grid {
        grid-template-columns: 1fr;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-group {
        justify-content: center;
      }
      .frame-action {
        right: 18px;
        bottom: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-card">
      <div class="loading-title" id="loadingTitle"></div>
      <div class="loading-text" id="loadingText"></div>
      <div class="loading-sub" id="loadingSub"></div>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <div class="shell" id="shell">
    <div class="top-line"></div>
    <div class="glow one" id="glowOne"></div>
    <div class="glow two" id="glowTwo"></div>

    <div class="inner">
      <div class="meta">
        <div class="badge" id="pageLabel"></div>
        <div class="meta-right">
          <div class="site-name" id="siteName"></div>
          <button class="music-btn" id="musicToggle" type="button">♪ 音乐开</button>
        </div>
      </div>

      <div class="stage">
        <!-- page 1 -->
        <section class="page active" id="page0">
          <div class="frame">
            <div class="frame-inner welcome-card">
              <div class="mini" id="p1Mini"></div>
              <h1 id="p1Title"></h1>
              <div class="subtext" id="p1Text"></div>
              <div class="ribbon"></div>
            </div>

            <div class="frame-action">
              <button class="frame-btn" id="p1Btn" onclick="goToPage(1)"></button>
            </div>
          </div>
        </section>

        <!-- page 2 -->
        <section class="page" id="page1">
          <div class="frame">
            <div class="frame-inner">
              <div class="mini" id="p2Mini"></div>
              <h2 id="p2Title"></h2>
              <div class="subtext" id="p2Text"></div>

              <div class="memory-grid">
                <div class="memory-card">
                  <div class="label" id="p2Card1Label"></div>
                  <div class="content" id="p2Card1Text"></div>
                </div>
                <div class="memory-card">
                  <div class="label" id="p2Card2Label"></div>
                  <div class="content" id="p2Card2Text"></div>
                </div>
              </div>

              <div class="layer-note" id="p2Note"></div>

              <span class="tiny-trigger" id="p2SecretTrigger" onclick="toggleSecret()"></span>
              <div class="tiny-secret" id="tinySecret"></div>
            </div>

            <div class="frame-action">
              <button class="frame-btn" id="p2Btn" onclick="goToPage(2)"></button>
            </div>
          </div>
        </section>

        <!-- page 3 -->
        <section class="page" id="page2">
          <div class="frame">
            <div class="frame-inner">
              <div class="mini" id="p3Mini"></div>
              <div class="letter-paper">
                <div class="letter-head">
                  <div class="letter-title" id="p3Title"></div>
                  <div class="letter-mark" id="p3Mark"></div>
                </div>

                <div class="letter-body" id="p3Body"></div>
              </div>
            </div>

            <div class="frame-action">
              <button class="frame-btn" id="p3Btn" onclick="goToPage(3)"></button>
            </div>
          </div>
        </section>

        <!-- page 4 -->
        <section class="page" id="page3">
          <div class="frame">
            <div class="frame-inner egg-page">
              <div class="mini" id="p4Mini"></div>
              <h2 id="p4Title"></h2>
              <p id="p4Text"></p>
              <button class="egg-btn" id="p4EggBtn" onclick="openChibiScene()"></button>
            </div>

            <div class="frame-action">
              <div class="frame-tag" id="p4Tag"></div>
            </div>
          </div>
        </section>
      </div>

      <div class="controls">
        <div class="btn-group">
          <button class="ghost-btn" id="prevBtn" onclick="prevPage()"></button>
        </div>
        <div class="dots" id="dots"></div>
      </div>

      <div class="bottom-text" id="bottomText"></div>
    </div>
  </div>

  <div class="chibi-overlay" id="chibiOverlay" onclick="closeChibiScene(event)">
    <div class="chibi-stage" id="chibiStage">
      <button class="chibi-close" onclick="forceCloseChibiScene()" type="button">×</button>
      <div class="chibi-caption" id="chibiCaption"></div>
      <img src="chibi-cake.png.png" alt="生日彩蛋插画" class="chibi-scene-img" id="chibiSceneImg" />
    </div>
  </div>

  <audio id="bgm" src="bgm.m4a" loop preload="auto"></audio>
  <audio id="voice" src="voice.m4a" preload="auto"></audio>

  <script>
    const CONTENT = {
      siteName: "璇璇生日附加页",
      labels: ["01 / 祝福", "02 / 夹层", "03 / 信", "04 / 彩蛋"],

      loading: {
        title: "birthday extra page",
        text: "正在打开璇璇的生日附加页…",
        sub: "这一次不是普通链接，是礼物里的隐藏夹层。"
      },

      page1: {
        mini: "birthday card",
        title: "给璇璇的一页生日祝福",
        text: "生日快乐。\n愿你新的一岁平安、明亮、顺遂，常常开心，偶尔惊喜，也一直拥有感受幸福的能力。",
        btn: "继续往下看"
      },

      page2: {
        mini: "hidden layer",
        title: "这一页算礼物里的隐藏小夹层",
        text: "我们不是那种总有很多话要说的人，可你又一直都在。\n没有很喧闹，却也从来没有真正离开过。",
        card1Label: "小纸条 01",
        card1Text: "不是想把礼物做得多夸张，\n只是想让它看起来更像一份认真准备过的心意。",
        card2Label: "小纸条 02",
        card2Text: "盒子、花、小细节，还有这一页，\n其实都是一点一点慢慢想出来的。",
        note: "就像礼物盒里那张小信封一样，\n这一页只是想让整份礼物更完整一点。",
        secretTrigger: "这里还有一句小小的补充",
        secretText: "有些心意不一定适合放在最显眼的地方，\n但藏在这里，好像刚刚好。",
        btn: "继续往下看"
      },

      page3: {
        mini: "letter",
        title: "写给璇璇的话",
        mark: "letter",
        body: `璇璇：

在准备它们的时候，

突然想起你。

还有这些藏在里面的小心思，

生日快乐，璇璇。

—— 徐源`,
        btn: "还有最后一页"
      },

      page4: {
        mini: "final page",
        title: "还有最后一个小彩蛋",
        text: "如果你已经看到这里了，那这份礼物里藏着的小心思，\n应该也算被你好好收到啦。",
        eggBtn: "for 最好的璇璇",
        tag: "最后一页"
      },

      common: {
        prevBtn: "上一层",
        bottomText: "这一页不是为了热闹，只是想让整份礼物多一点可以被保存下来的东西。",
        chibiCaption: "生日快乐，璇璇。"
      }
    };

    const labels = CONTENT.labels;
    let currentStep = 0;
    let musicEnabled = true;
    let bgmStarted = false;
    let voicePlayed = false;

    const pages = [
      document.getElementById("page0"),
      document.getElementById("page1"),
      document.getElementById("page2"),
      document.getElementById("page3")
    ];

    const bgm = document.getElementById("bgm");
    const voice = document.getElementById("voice");
    const musicToggle = document.getElementById("musicToggle");
    const chibiOverlay = document.getElementById("chibiOverlay");
    const chibiStage = document.getElementById("chibiStage");
    const chibiSceneImg = document.getElementById("chibiSceneImg");

    bgm.volume = 0.26;
    voice.volume = 1.0;

    function applyContent() {
      document.getElementById("siteName").textContent = CONTENT.siteName;

      document.getElementById("loadingTitle").textContent = CONTENT.loading.title;
      document.getElementById("loadingText").textContent = CONTENT.loading.text;
      document.getElementById("loadingSub").textContent = CONTENT.loading.sub;

      document.getElementById("p1Mini").textContent = CONTENT.page1.mini;
      document.getElementById("p1Title").textContent = CONTENT.page1.title;
      document.getElementById("p1Text").textContent = CONTENT.page1.text;
      document.getElementById("p1Btn").textContent = CONTENT.page1.btn;

      document.getElementById("p2Mini").textContent = CONTENT.page2.mini;
      document.getElementById("p2Title").textContent = CONTENT.page2.title;
      document.getElementById("p2Text").textContent = CONTENT.page2.text;
      document.getElementById("p2Card1Label").textContent = CONTENT.page2.card1Label;
      document.getElementById("p2Card1Text").textContent = CONTENT.page2.card1Text;
      document.getElementById("p2Card2Label").textContent = CONTENT.page2.card2Label;
      document.getElementById("p2Card2Text").textContent = CONTENT.page2.card2Text;
      document.getElementById("p2Note").textContent = CONTENT.page2.note;
      document.getElementById("p2SecretTrigger").textContent = CONTENT.page2.secretTrigger;
      document.getElementById("tinySecret").textContent = CONTENT.page2.secretText;
      document.getElementById("p2Btn").textContent = CONTENT.page2.btn;

      document.getElementById("p3Mini").textContent = CONTENT.page3.mini;
      document.getElementById("p3Title").textContent = CONTENT.page3.title;
      document.getElementById("p3Mark").textContent = CONTENT.page3.mark;
      document.getElementById("p3Body").textContent = CONTENT.page3.body;
      document.getElementById("p3Btn").textContent = CONTENT.page3.btn;

      document.getElementById("p4Mini").textContent = CONTENT.page4.mini;
      document.getElementById("p4Title").textContent = CONTENT.page4.title;
      document.getElementById("p4Text").textContent = CONTENT.page4.text;
      document.getElementById("p4EggBtn").textContent = CONTENT.page4.eggBtn;
      document.getElementById("p4Tag").textContent = CONTENT.page4.tag;

      document.getElementById("prevBtn").textContent = CONTENT.common.prevBtn;
      document.getElementById("bottomText").textContent = CONTENT.common.bottomText;
      document.getElementById("chibiCaption").textContent = CONTENT.common.chibiCaption;
    }

    async function tryPlayBgm(source = "manual") {
      if (!musicEnabled) return false;
      try {
        await bgm.play();
        bgmStarted = true;
        updateMusicButton();
        return true;
      } catch (e) {
        updateMusicButton();
        return false;
      }
    }

    function updateMusicButton() {
      if (!musicEnabled) {
        musicToggle.textContent = "♪ 音乐关";
        return;
      }
      if (bgm.paused) {
        musicToggle.textContent = "♪ 点我开音乐";
      } else {
        musicToggle.textContent = "♪ 音乐开";
      }
    }

    async function ensureBgmStarted() {
      if (!musicEnabled) return;
      if (!bgmStarted || bgm.paused) {
        await tryPlayBgm("interaction");
      }
    }

    musicToggle.addEventListener("click", async () => {
      if (bgm.paused) {
        musicEnabled = true;
        await tryPlayBgm("toggle");
      } else {
        bgm.pause();
        musicEnabled = false;
        updateMusicButton();
      }
    });

    async function goToPage(index) {
      await ensureBgmStarted();
      currentStep = index;
      renderPage();
    }

    async function prevPage() {
      await ensureBgmStarted();
      if (currentStep > 0) {
        currentStep--;
        renderPage();
      }
    }

    function renderPage() {
      pages.forEach((page, index) => {
        page.classList.toggle("active", index === currentStep);
      });

      document.getElementById("pageLabel").textContent = labels[currentStep];
      renderDots();
    }

    function renderDots() {
      const dotsWrap = document.getElementById("dots");
      dotsWrap.innerHTML = "";

      for (let i = 0; i < pages.length; i++) {
        const dot = document.createElement("div");
        dot.className = i === currentStep ? "dot active" : "dot";
        dot.onclick = async () => {
          await ensureBgmStarted();
          currentStep = i;
          renderPage();
        };
        dotsWrap.appendChild(dot);
      }
    }

    function toggleSecret() {
      const box = document.getElementById("tinySecret");
      box.style.display = box.style.display === "block" ? "none" : "block";
    }

    async function openChibiScene() {
      await ensureBgmStarted();

      chibiOverlay.classList.add("show");
      document.body.style.overflow = "hidden";
      chibiStage.classList.remove("show");
      chibiSceneImg.classList.remove("show");

      requestAnimationFrame(() => {
        chibiStage.classList.add("show");
        chibiSceneImg.classList.add("show");
      });

      if (!voicePlayed) {
        voicePlayed = true;
        try {
          if (!bgm.paused) bgm.volume = 0.08;
          voice.currentTime = 0;
          await voice.play();
        } catch (e) {}
      }
    }

    voice.addEventListener("ended", () => {
      if (!bgm.paused && musicEnabled) {
        bgm.volume = 0.26;
      }
    });

    function closeChibiScene(event) {
      if (event.target === chibiOverlay) {
        forceCloseChibiScene();
      }
    }

    function forceCloseChibiScene() {
      chibiOverlay.classList.remove("show");
      chibiStage.classList.remove("show");
      chibiSceneImg.classList.remove("show");
      document.body.style.overflow = "";
    }

    window.addEventListener("load", () => {
      applyContent();

      const loading = document.getElementById("loadingScreen");
      const shell = document.getElementById("shell");

      setTimeout(async () => {
        loading.classList.add("hidden");
        shell.classList.add("ready");
        await tryPlayBgm("load");
        updateMusicButton();
      }, 1050);
    });

    const glowOne = document.getElementById("glowOne");
    const glowTwo = document.getElementById("glowTwo");

    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 12;
      const y = (e.clientY / window.innerHeight - 0.5) * 12;
      glowOne.style.transform = `translate(${x}px, ${y}px)`;
      glowTwo.style.transform = `translate(${-x}px, ${-y}px)`;
    });

    renderPage();
    updateMusicButton();
  </script>
</body>
</html>
